name: Talabat Mart Radar

on:
  workflow_dispatch:

concurrency:
  group: talabat-mart-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-talabat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies and Playwright browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --only-shell
          playwright install-deps chromium

      - name: Run Talabat Mart Radar
        env:
          TALABAT_TELEGRAM_TOKEN: ${{ secrets.TALABAT_TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TALABAT_COOKIES: ${{ secrets.TALABAT_COOKIES }}
          TALABAT_LAT: ${{ secrets.TALABAT_LAT }}
          TALABAT_LNG: ${{ secrets.TALABAT_LNG }}
          TALABAT_MART_URL: ${{ secrets.TALABAT_MART_URL }}
        run: python talabat_radar.py

      - name: Save sent deals cache (sent_talabat.json)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent_talabat.json || true
          git diff --staged --quiet || (
            git commit -m "chore: update sent_talabat cache"
            git pull --rebase origin main || (
              git checkout --theirs sent_talabat.json && git add sent_talabat.json && git rebase --continue
            )
            git push
          )
