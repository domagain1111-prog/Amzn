name: Amazon Warehouse 24-7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Jumia Scanner (if exists)
        if: hashFiles('jumia_bot.py') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python jumia_bot.py

      - name: Run Amazon Now Scanner (if exists)
        if: hashFiles('amazon_now_bot.py') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AMAZON_COOKIES: ${{ secrets.AMAZON_COOKIES }}
        run: python amazon_now_bot.py

      - name: Run Amazon Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Save sent deals memory
        run: |
          git config user.name "AmazonBot"
          git config user.email "bot@users.noreply.github.com"
          git add sent_deals.json sent_jumia.json sent_now.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update deals cache"
          git push
