name: Amazon Warehouse 24-7

on:
  workflow_dispatch:

concurrency:
  group: warehouse-bot-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Jumia Scanner (if exists)
        if: hashFiles('jumia_bot.py') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python jumia_bot.py

      - name: Run Amazon Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Save sent deals memory reliably
        if: always()
        run: |
          git config user.name "AmazonBot"
          git config user.email "bot@users.noreply.github.com"
          cp sent_deals.json /tmp/sent_deals.bak 2>/dev/null || true
          cp sent_jumia.json /tmp/sent_jumia.bak 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/sent_deals.bak sent_deals.json 2>/dev/null || true
          cp /tmp/sent_jumia.bak sent_jumia.json 2>/dev/null || true
          git add sent_deals.json sent_jumia.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update warehouse deals cache" && git push origin main)
