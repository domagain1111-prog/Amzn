name: Amazon Now 24-7

on:
  workflow_dispatch:

concurrency:
  group: now-bot-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan_now:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run Amazon Now Scanner
        env:
          NOW_TELEGRAM_TOKEN: ${{ secrets.NOW_TELEGRAM_TOKEN }}
          NOW_CHAT_ID: ${{ secrets.NOW_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AMAZON_COOKIES: ${{ secrets.AMAZON_COOKIES }}
        run: python amazon_now_bot.py

      - name: Force Save Amazon Now Memory
        if: always()
        run: |
          git config user.name "AmazonNowBot"
          git config user.email "bot@users.noreply.github.com"

          ls -lh sent_now.json || echo "⚠️ ملف sent_now.json لم يُنشأ بعد!"
          cp sent_now.json /tmp/sent_now.bak 2>/dev/null || true

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sent_now.bak sent_now.json 2>/dev/null || true

            git add -f sent_now.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "ℹ️ الملف مطابق لآخر نسخة محفوظة على GitHub."
              break
            fi

            git commit -m "Update Amazon Now cache [skip ci]"
            if git push origin HEAD:main; then
              echo "✅ تم رفع وحفظ sent_now.json على GitHub بنجاح!"
              break
            fi
            echo "⏳ إعادة المحاولة ($i)..."
            sleep 3
          done
